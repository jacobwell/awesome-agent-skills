  - name: "Eye.Art Polyphemus"
    url: "https://github.com/jacobwell/skills/tree/add-eye-art-polyphemus-skill/skills/eye-art-polyphemus"
    description: "Portable agent skill for image generation and editing through Eye.Art's anonymous MCP, routing requests to artist-guided image flows, reference edits, site-matched visuals, editable SVG, and supported motion."
    platform: ["Codex", "Claude Code", "Cursor", "General Agent Skills"]
    category: ["Design & Media", "MCP & Tool Use"]
    tags: ["eye-art", "image-generation", "image-editing", "svg", "streamable-http", "artist-workflows"]
    maturity: "promising"
    license: "Apache-2.0"
    maintained: true
    install: "Connect https://eye.art/api/eye-mcp as a remote Streamable HTTP MCP server, then install and follow the linked Eye.Art Polyphemus skill."
    why_awesome: "Pairs a portable routing guide with one MCP entry point so agents can choose image generation, reference edits, site-matched visuals, editable SVG, or supported motion without exposing the workflow catalog."
    type: "Agent Skill"
    input: "Natural-language image, edit, vector, or motion requests, with optional reference images, page code, and conversation context."
    output: "Raster images or editable SVG with status and workflow metadata."
    tools: ["Eye.Art MCP"]
    safety_notes: "No key is required; anonymous use is rate limited. Prompts, references, and conversations may be retained for up to 30 days. Send only images the user intends to process and check the returned job status. Artist names are visual direction and do not imply endorsement."
